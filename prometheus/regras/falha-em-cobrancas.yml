groups:
  - name: cobrancas
    rules:
      - alert: FalhaEmCobrancas
        expr: |
          (
            sum(rate(cobrancas_processadas_total{resultado="falha"}[1m]))
            /
            sum(rate(cobrancas_processadas_total[1m]))
          ) > (1 - 0.999)
          and on()
          (sum(rate(cobrancas_processadas_total[1m])) > 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Falhas tecnicas de cobranca acima do budget do SLO
          description: A fracao de falhas tecnicas excede 0,1% por 1m (SLO de 99,9% em 30d). Recusas legitimas nao sao falhas.
